# =============================================================================
# security.conf — Global security headers
# =============================================================================
# These headers are injected into every proxied response.
# Uncomment one by one as you learn each security mechanism.
# =============================================================================

# ---------------------------------------------------------------------------
# Prevent browsers from MIME-sniffing the content type
# ---------------------------------------------------------------------------
# add_header X-Content-Type-Options  "nosniff"          always;

# ---------------------------------------------------------------------------
# Deny embedding the site in iframes (clickjacking protection)
# ---------------------------------------------------------------------------
# add_header X-Frame-Options         "SAMEORIGIN"       always;

# ---------------------------------------------------------------------------
# Enable browser XSS filter (legacy browsers)
# ---------------------------------------------------------------------------
# add_header X-XSS-Protection        "1; mode=block"    always;

# ---------------------------------------------------------------------------
# Referrer policy — only send origin, not full URL
# ---------------------------------------------------------------------------
# add_header Referrer-Policy         "strict-origin"    always;

# ---------------------------------------------------------------------------
# Content Security Policy — allow resources only from same origin
# ---------------------------------------------------------------------------
# add_header Content-Security-Policy "default-src 'self'" always;

# ---------------------------------------------------------------------------
# Hide the Nginx version number from response headers
# ---------------------------------------------------------------------------
server_tokens off;
