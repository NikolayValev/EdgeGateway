# =============================================================================
# logging.conf — Custom log format
# =============================================================================
# The "main" format adds upstream response time and cache status to the default
# combined log so you can observe performance and caching behaviour easily.
# =============================================================================

log_format main '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rt=$request_time '                    # total request time
                'uct=$upstream_connect_time '          # upstream connect time
                'uht=$upstream_header_time '           # upstream time-to-first-byte
                'urt=$upstream_response_time '         # full upstream response time
                'cs=$upstream_cache_status';           # HIT / MISS / BYPASS

access_log /var/log/nginx/access.log main;
