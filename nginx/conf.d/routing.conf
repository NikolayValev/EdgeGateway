# =============================================================================
# routing.conf — Virtual-host and location routing
# =============================================================================
# Gzip, rate-limit zones, and proxy_cache are referenced here but defined in
# their respective conf.d/ files. Enable them by uncommenting the directives.
# =============================================================================

# ---------------------------------------------------------------------------
# Rate-limit zone (defined in cache.conf — move to a dedicated ratelimit.conf
# when you are ready to use it)
# ---------------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    # gzip on;
    # gzip_types text/plain text/css application/json application/javascript;

    # -----------------------------------------------------------------------
    # Static files — served directly by Nginx
    # -----------------------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Custom 404 page
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # -----------------------------------------------------------------------
    # API service proxy
    # -----------------------------------------------------------------------
    location /api/ {
        # TODO (rate limiting): uncomment to enforce request rate
        # limit_req zone=api_limit burst=20 nodelay;

        # TODO (caching): uncomment to cache API responses
        # proxy_cache api_cache;
        # proxy_cache_valid 200 1m;

        proxy_pass         http://api_pool/;
        proxy_http_version 1.1;

        # Standard proxy headers — let the backend know the real client info
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # Auth service proxy
    # -----------------------------------------------------------------------
    location /auth/ {
        proxy_pass         http://auth_pool/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
