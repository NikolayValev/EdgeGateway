# =============================================================================
# upstreams.conf — Backend service pools
# =============================================================================
# Add more server lines here to enable round-robin load balancing.
# Example:
#   upstream api_pool {
#       server api:3000;
#       server api2:3000;   # second API instance
#   }
# =============================================================================

upstream api_pool {
    server api:3000;
    # TODO (load balancing): add more api instances here
}

upstream auth_pool {
    server auth:3001;
    # TODO (load balancing): add more auth instances here
}
