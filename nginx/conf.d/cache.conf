# =============================================================================
# cache.conf — Proxy cache zone definitions
# =============================================================================
# Define a shared memory zone and storage path for caching upstream responses.
# To activate caching for a location, add the following directives there:
#
#   proxy_cache       api_cache;
#   proxy_cache_valid 200 1m;   # cache 200 responses for 1 minute
#
# See routing.conf for the TODO markers.
# =============================================================================

# proxy_cache_path /var/cache/nginx/api
#     levels=1:2
#     keys_zone=api_cache:10m   # 10 MB of shared key storage
#     max_size=100m             # evict oldest entries beyond 100 MB
#     inactive=60m              # evict entries not accessed in 60 minutes
#     use_temp_path=off;
