# =============================================================================
# nginx.conf — Main Nginx configuration for EdgeGateway
# =============================================================================
# This file sets global worker and event settings, then pulls in per-feature
# configuration from conf.d/. Each file in conf.d/ covers one concern so it
# is easy to enable/disable features while learning.
# =============================================================================

user  nginx;
worker_processes  auto;          # one worker per CPU core

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;    # max simultaneous connections per worker
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ---------------------------------------------------------------------------
    # Modular feature configs — uncomment/add files as features are introduced
    # ---------------------------------------------------------------------------
    include /etc/nginx/conf.d/logging.conf;    # custom log format
    include /etc/nginx/conf.d/cache.conf;      # proxy cache zones
    include /etc/nginx/conf.d/security.conf;   # global security headers
    include /etc/nginx/conf.d/upstreams.conf;  # upstream backend pools
    include /etc/nginx/conf.d/routing.conf;    # virtual-host routing rules
}
